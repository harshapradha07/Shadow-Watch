<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — ShadowWatch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Poppins',sans-serif}</style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center">
  <div class="max-w-2xl w-full p-8 bg-[#071028] rounded-2xl shadow-xl">
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <svg class="w-10 h-10 text-cyan-400" viewBox="0 0 24 24" fill="none"><path d="M12 2L3 6v5c0 5 3.8 9.7 9 11 5.2-1.3 9-6 9-11V6l-9-4z" fill="#06b6d4"/></svg>
        <h1 class="text-2xl font-semibold">ShadowWatch</h1>
      </div>
      <div class="text-sm text-slate-400">Cybersecurity • Demo</div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Email login -->
      <div class="p-4 bg-slate-800 rounded-lg">
        <h2 class="text-lg font-medium mb-3">Sign in with Email</h2>
        <form id="emailForm" class="space-y-3">
          <input id="email" type="email" placeholder="Email" required class="w-full p-3 rounded bg-slate-900 border border-slate-700"/>
          <input id="password" type="password" placeholder="Password" required class="w-full p-3 rounded bg-slate-900 border border-slate-700"/>
          <button type="submit" class="w-full py-3 rounded bg-gradient-to-r from-cyan-400 to-blue-600 text-slate-900 font-semibold">Sign in</button>
        </form>
        <p id="emailMsg" class="mt-2 text-sm text-amber-300"></p>
      </div>
<div id="g_id_onload"
     data-client_id="YOUR_GOOGLE_CLIENT_ID_HERE"
     data-context="signin"
     data-ux_mode="popup"
     data-login_uri="http://localhost:5000/auth/google"
     data-auto_prompt="false">
</div>

<div class="g_id_signin"
     data-type="standard"
     data-shape="rectangular"
     data-theme="outline"
     data-text="sign_in_with"
     data-size="large"
     data-logo_alignment="left">
</div>

      <!-- Google sign-in -->
      <div class="p-4 bg-slate-800 rounded-lg flex flex-col justify-center items-center">
        <h2 class="text-lg font-medium mb-3">Or sign in with Google</h2>
        <div id="googleSignInDiv"></div>
        <p class="text-sm text-slate-400 mt-3">We use Google for secure authentication. Your token is verified on our backend.</p>
      </div>
    </div>

    <p class="mt-6 text-slate-400 text-sm">Don't have an account? This demo accepts any email for quick testing.</p>
  </div>

  <script>
    // Email form demo behavior
    document.getElementById('emailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      // simple demo: store in session and redirect
      sessionStorage.setItem('shadow_user', JSON.stringify({ email }));
      window.location.href = 'dashboard.html';
    });

    // Google Identity
    function handleCredentialResponse(response) {
      // send ID token to backend for verification and login
      fetch('/api/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id_token: response.credential })
      })
      .then(r => r.json())
      .then(data => {
        if (data && data.email) {
          sessionStorage.setItem('shadow_user', JSON.stringify({ email: data.email }));
          window.location.href = 'dashboard.html';
        } else {
          alert('Google sign-in failed');
        }
      })
      .catch(err => {
        console.error(err); alert('Server error during Google login');
      });
    }

    window.onload = () => {
      google.accounts.id.initialize({
        client_id: 'YOUR_GOOGLE_CLIENT_ID',
        callback: handleCredentialResponse
      });
      google.accounts.id.renderButton(
        document.getElementById('googleSignInDiv'),
        { theme: 'outline', size: 'large' }
      );
      google.accounts.id.prompt(); // optional
    };
  </script>
</body>
</html>
